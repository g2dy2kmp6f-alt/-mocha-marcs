<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1b14">
<title>Mocha Marc's</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f3eadc;--paper:#fffaf2;--ink:#2d1b12;--muted:#7d695b;--accent:#6f3d20;--accent2:#a96d3b;--line:#dfcfbd;--ok:#326b49;--shadow:0 10px 28px rgba(65,38,21,.08)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#efe2d0 0,#f8f1e8 210px,var(--bg) 100%);color:var(--ink);min-height:100vh}
header{max-width:760px;margin:auto;padding:12px 16px 4px;display:flex;align-items:center;justify-content:center}header img{width:88px;height:88px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 5px 10px rgba(72,40,20,.12))}
main{max-width:760px;margin:auto;padding:4px 14px 90px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;background:rgba(255,250,242,.78);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:4px 0 14px;backdrop-filter:blur(8px)}
button,.btn,select,input,textarea{font:inherit}.tabs button,.primary,.secondary{border:0;font-weight:750;transition:.15s ease}.tabs button{border-radius:13px;padding:10px 5px;background:transparent;color:#60493a;font-size:.82rem}.tabs button.active{background:var(--accent);color:#fff;box-shadow:0 5px 12px rgba(77,40,19,.18)}
.primary{background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 4px 10px rgba(82,43,21,.12)}.secondary{background:#eee0cf;color:var(--ink);border-radius:12px;padding:10px 13px}
.card{background:rgba(255,250,242,.94);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}
#order>.card{padding:16px}.drink{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;box-shadow:none;background:#fffdf8}.drink h3{margin:0 0 3px;font-size:1rem;letter-spacing:-.01em}.drink .primary{padding:8px 12px;font-size:.88rem}.small{font-size:.84rem;color:var(--muted)}
#menu>h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;margin:22px 2px 8px;color:#80614d}#menu>h2:first-child{margin-top:18px}#menu>h2:nth-of-type(2){color:var(--accent)}
label{display:block;font-weight:750;margin:12px 0 6px;font-size:.9rem}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fffdf9;padding:11px 12px;color:var(--ink);outline:none}select:focus,input:focus,textarea:focus{border-color:#b78965;box-shadow:0 0 0 3px rgba(169,109,59,.10)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chip{border:1px solid var(--line);background:#fffdf9;border-radius:12px;padding:9px 10px;text-align:center;color:var(--ink)}.chip.on{background:#e8d1ba;border-color:#b9845d;font-weight:750}
.hidden{display:none!important}.status{display:inline-block;font-weight:850;font-size:.78rem;padding:5px 9px;border-radius:999px;background:#f0e2d4;margin:5px 0}.New{color:#8a552f}.Making{color:#986000}.Ready{color:var(--ok)}.Done{color:var(--muted)}
.notice{background:#fff2cf;border:1px solid #e7ce83;padding:12px;border-radius:12px;margin:10px 0}.favrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.favrow button{flex:1;min-width:72px}
.order-details{margin-top:10px;padding:10px 0;border-top:1px dashed var(--line);line-height:1.55}.order-details b{color:var(--accent)}
#board>.card>h2,#pinGate h2{margin:2px 0 12px;font-size:1.35rem}#boardOrders>.card{border-left:4px solid #b7835c;padding:14px 14px 13px}#boardOrders h3{margin:0 0 3px;font-size:1.08rem}
@media(max-width:520px){header img{width:82px;height:82px}.tabs{margin-top:2px}.tabs button{font-size:.76rem;padding:9px 3px}.card{border-radius:16px}.chips{grid-template-columns:1fr 1fr}}

#menu{padding-bottom:10px}
#menu .drink{position:relative;overflow:hidden;min-height:72px;background:linear-gradient(135deg,#fffdf9,#f6eadc)}
#menu .drink:before{content:"☕";display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#ead7c2;font-size:21px;grid-row:1 / span 2}
#menu .drink>div:first-of-type{min-width:0}
#menu .drink .primary{background:#6b351b}
#menu>h2:after{content:"";display:block;width:34px;height:3px;border-radius:9px;background:#a96d3b;margin-top:7px}
@media(max-width:520px){#menu .drink{grid-template-columns:42px 1fr auto;gap:10px}}
</style>
</head>
<body>
<header><img src="logo.png" alt="Mocha Marc's Coffee Shop"></header>
<main>
<div class="tabs">
<button id="tabOrder" class="active" onclick="showTab('order')">Order</button>
<button id="tabFav" onclick="showTab('favorites')">Favorites</button>
<button id="tabMine" onclick="showTab('mine')">My Orders</button>
<button id="tabBarista" onclick="showTab('barista')">Barista</button>
</div>

<section id="order">
<div class="card">
<label>Your name</label><input id="customerName" autocomplete="name" placeholder="First name">
<div id="menu"></div>
</div>
</section>

<section id="customize" class="hidden">
<div class="card">
<button class="secondary" onclick="backToMenu()">← Back</button>
<h2 id="drinkTitle"></h2><p id="specialtyNote" class="small hidden">Marc's specialty recipe. Recipe details are kept private.</p>
<div id="shotWrap"><label>Espresso shots</label><select id="shots"></select></div>
<div id="milkWrap"><label>Milk</label><select id="milk"><option>2% Milk</option><option>Oat Milk</option></select></div>
<div id="syrupWrap"><label>Syrups</label><div id="syrups" class="chips"></div></div>
<div id="sauceWrap"><label>Sauces</label><div id="sauces" class="chips"></div></div>
<div id="foamWrap"><label><input type="checkbox" id="foam" style="width:auto"> Add Cold Foam</label></div>
<label>Special instructions</label><textarea id="notes" rows="3" placeholder="Optional"></textarea>
<div class="favrow"><button class="primary" onclick="submitOrder()">Send Order to Marc</button><button class="secondary" onclick="saveFavorite()">♡ Save Favorite</button></div>
<div id="msg"></div>
</div>
</section>

<section id="favorites" class="hidden"><div id="favList"></div></section>
<section id="mine" class="hidden"><div id="myOrders"></div></section>

<section id="barista" class="hidden">
<div id="pinGate" class="card"><h2>Marc's Barista Board</h2><label>PIN</label><input id="pin" inputmode="numeric" type="password"><button class="primary" style="margin-top:10px" onclick="unlock()">Open Board</button></div>
<div id="board" class="hidden"><div class="card"><h2>Barista Board</h2><button class="secondary" onclick="loadBoard()">Refresh</button><div id="boardOrders"></div></div></div>
</section>
</main>

<script>
const SUPABASE_URL = "https://trgakqjujyvvumpbfurt.supabase.co";
const SUPABASE_KEY = "sb_publishable_A8qguEaqgKw6UxS7U9Bi0g_Pk5PV0Sh";
const drinks = [
 {name:"Espresso",type:"regular",shots:[1,2,3],milk:false,syrups:false,sauces:false,foam:false},
 {name:"Americano",type:"regular",shots:[1,2,3],milk:false,syrups:true,sauces:false,foam:false},
 {name:"Latte",type:"regular",shots:[1,2,3],milk:true,syrups:true,sauces:true,foam:false},
 {name:"Cappuccino",type:"regular",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:false},
 {name:"Mocha",type:"regular",shots:[1,2,3],milk:true,syrups:true,sauces:true,foam:false},
 {name:"Flat White",type:"regular",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:false},
 {name:"Iced Coffee",type:"regular",shots:[0,1,2,3],milk:true,syrups:true,sauces:false,foam:true},
 {name:"Cold Brew",type:"regular",shots:[0,1,2,3],milk:true,syrups:true,sauces:true,foam:true},
 {name:"Iced Latte",type:"specialty",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:true},
 {name:"Iced Mocha",type:"specialty",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:true},
 {name:"Iced Caramel Macchiato",type:"specialty",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:true,preset:{recipe:"Vanilla + Caramel Sauce"}},
 {name:"Brown Sugar Shaken Espresso",type:"specialty",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:true,preset:{recipe:"Vanilla + Brown Sugar"}},
 {name:"Iced White Chocolate Cinnamon Dolce Latte",type:"specialty",shots:[1,2,3],milk:true,syrups:false,sauces:false,foam:true},
 {name:"Hazelnut Cream Americano",type:"specialty",shots:[1,2,3],milk:false,syrups:false,sauces:false,foam:false}
];
const syrupNames=["Hazelnut","Vanilla","Cinnamon Dolce","Caramel","Salted Caramel","Brown Sugar"];
const sauceNames=["White Chocolate","Caramel Sauce"];
let current=null, chosenSyrups={}, chosenSauces={};

function showTab(id){
 ["order","customize","favorites","mine","barista"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));
 ["Order","Fav","Mine","Barista"].forEach(x=>document.getElementById("tab"+x)?.classList.remove("active"));
 if(id==="order")tabOrder.classList.add("active"); if(id==="favorites"){tabFav.classList.add("active");renderFavorites()}
 if(id==="mine"){tabMine.classList.add("active");loadMyOrders()} if(id==="barista")tabBarista.classList.add("active");
}
function renderMenu(){
 menu.innerHTML="";
 for(const group of ["regular","specialty"]){
   const h=document.createElement("h2");h.textContent=group==="regular"?"Coffee":"Marc's Specialty Drinks";menu.appendChild(h);
   drinks.filter(d=>d.type===group).forEach(d=>{
    const c=document.createElement("div");c.className="card drink";
    c.innerHTML=`<div><h3>${d.name}</h3><div class="small">${d.type==="specialty"?"Marc's house specialty":"Made to order"}</div></div><button class="primary">Choose</button>`;
    c.querySelector("button").onclick=()=>chooseDrink(d);menu.appendChild(c);
   });
 }
}
function normalizePumps(v){
 const out={}; if(Array.isArray(v)) v.forEach(x=>{if(typeof x==="string")out[x]=1;else if(x?.name)out[x.name]=Number(x.pumps)||1});
 else if(v&&typeof v==="object") Object.entries(v).forEach(([k,n])=>{if(Number(n)>0)out[k]=Number(n)});
 return out;
}
function pumpLabel(name,n){return n?`${name} · ${n} pump${n===1?"":"s"}`:name}
function chips(el,names,target){
 el.innerHTML="";
 names.forEach(n=>{
   let b=document.createElement("button"); b.type="button"; b.className="chip pumpchip";
   const draw=()=>{const pumps=Number(target[n]||0);b.textContent=pumpLabel(n,pumps);b.classList.toggle("on",pumps>0)};
   b.onclick=()=>{const next=(Number(target[n]||0)+1)%4;if(next)target[n]=next;else delete target[n];draw()};
   draw();el.appendChild(b);
 })
}
function chooseDrink(d,preset=null){
 current=d;chosenSyrups=normalizePumps(preset?.syrups);chosenSauces=normalizePumps(preset?.sauces);
 drinkTitle.textContent=d.name; specialtyNote.classList.toggle("hidden",d.type!=="specialty");
 shotWrap.classList.toggle("hidden",!d.shots); shots.innerHTML=(d.shots||[]).map(x=>`<option value="${x}">${x} shot${x===1?"":"s"}</option>`).join("");
 if(preset?.shots!=null) shots.value=preset.shots;
 milkWrap.classList.toggle("hidden",!d.milk); if(preset?.milk)milk.value=preset.milk;
 syrupWrap.classList.toggle("hidden",!d.syrups); sauceWrap.classList.toggle("hidden",!d.sauces); foamWrap.classList.toggle("hidden",!d.foam);
 foam.checked=!!preset?.foam; notes.value=preset?.notes||""; chips(syrups,syrupNames,chosenSyrups);chips(sauces,sauceNames,chosenSauces);

 order.classList.add("hidden");customize.classList.remove("hidden");
}
function backToMenu(){customize.classList.add("hidden");order.classList.remove("hidden")}
function orderPayload(){
 return {drink:current.name,milk:current.milk?milk.value:null,shots:current.shots?Number(shots.value):null,
 customizations:{syrups:current.syrups?chosenSyrups:{},sauces:current.sauces?chosenSauces:{},cold_foam:current.foam?foam.checked:false},
 notes:notes.value.trim()};
}
async function api(path,opt={}){
 const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=representation",...(opt.headers||{})};
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers}); if(!r.ok)throw new Error(await r.text()); return r.status===204?null:r.json();
}
function deviceId(){let x=localStorage.mmDevice;if(!x){x=crypto.randomUUID();localStorage.mmDevice=x}return x}
async function submitOrder(){
 const name=customerName.value.trim(); if(!name){msg.innerHTML='<div class="notice">Enter your name first.</div>';return}
 localStorage.mmName=name; const p=orderPayload();
 try{
  const rows=await api("orders",{method:"POST",body:JSON.stringify({customer_name:name,drink:p.drink,milk:p.milk,shots:p.shots,customizations:{...p.customizations,device_id:deviceId()},notes:p.notes,status:"New"})});
  const ids=JSON.parse(localStorage.mmOrderIds||"[]"); if(rows?.[0]?.id)ids.push(rows[0].id);localStorage.mmOrderIds=JSON.stringify(ids);
  msg.innerHTML='<div class="notice">☕ Order sent to Marc!</div>';
 }catch(e){msg.innerHTML='<div class="notice">Could not send order. '+e.message+'</div>'}
}
function saveFavorite(){
 const p=orderPayload(); const name=prompt("Name this favorite:",current.name);if(!name)return;
 const fs=JSON.parse(localStorage.mmFavs||"[]");fs.push({name,...p});localStorage.mmFavs=JSON.stringify(fs);alert("Favorite saved.");
}
function renderFavorites(){
 const fs=JSON.parse(localStorage.mmFavs||"[]");favList.innerHTML=fs.length?"":"<div class='card'>No favorites saved yet.</div>";
 fs.forEach((f,i)=>{let c=document.createElement("div");c.className="card";c.innerHTML=`<h3>${f.name}</h3><div class="small">${f.drink}</div><div class="favrow"><button class="primary">Order Again</button><button class="secondary">Delete</button></div>`;
 c.children[2].children[0].onclick=()=>{const d=drinks.find(x=>x.name===f.drink);showTab("order");chooseDrink(d,f)};
 c.children[2].children[1].onclick=()=>{fs.splice(i,1);localStorage.mmFavs=JSON.stringify(fs);renderFavorites()};favList.appendChild(c)});
}
async function loadMyOrders(){
 const ids=JSON.parse(localStorage.mmOrderIds||"[]"); if(!ids.length){myOrders.innerHTML="<div class='card'>No orders from this device yet.</div>";return}
 try{const rows=await api(`orders?select=id,created_at,drink,status,milk,shots,notes&order=created_at.desc&id=in.(${ids.join(",")})`);
 myOrders.innerHTML=rows.map(r=>`<div class="card"><h3>${r.drink}</h3><div class="status ${r.status}">${r.status}</div><div class="small">${new Date(r.created_at).toLocaleString()}</div></div>`).join("")}
 catch(e){myOrders.innerHTML="<div class='notice'>Could not load orders.</div>"}
}
function unlock(){if(pin.value==="1973"){pinGate.classList.add("hidden");board.classList.remove("hidden");loadBoard()}else alert("Incorrect PIN")}
function formatPumps(value){
 const p=normalizePumps(value); return Object.entries(p).map(([name,n])=>`${name} — ${n} pump${n===1?"":"s"}`).join("<br>");
}
function baristaDetails(r){
 const c=r.customizations||{}; const parts=[];
 const syr=formatPumps(c.syrups); const sau=formatPumps(c.sauces);
 if(syr)parts.push(`<div><b>Syrups:</b><br>${syr}</div>`);
 if(sau)parts.push(`<div><b>Sauces:</b><br>${sau}</div>`);
 if(c.cold_foam)parts.push(`<div><b>Cold Foam</b></div>`);
 return parts.length?`<div class="order-details">${parts.join("")}</div>`:"";
}
async function loadBoard(){
 try{const rows=await api("orders?select=id,created_at,customer_name,drink,milk,shots,customizations,notes,status&status=neq.Done&order=created_at.asc");
 boardOrders.innerHTML=rows.length?"":"<p>No active orders.</p>";
 rows.forEach(r=>{let c=document.createElement("div");c.className="card";c.innerHTML=`<h3>${r.customer_name} — ${r.drink}</h3><div class="status ${r.status}">${r.status}</div><div class="small">${r.milk||""} ${r.shots!=null?(" • "+r.shots+" shots"):""}</div>${baristaDetails(r)}${r.notes?`<p><b>Note:</b> ${r.notes}</p>`:""}<div class="favrow"></div>`;
 ["New","Making","Ready","Done"].forEach(s=>{let b=document.createElement("button");b.className="secondary";b.textContent=s;b.onclick=()=>setStatus(r.id,s);c.lastElementChild.appendChild(b)});boardOrders.appendChild(c)});
 }catch(e){boardOrders.innerHTML="<div class='notice'>Could not load the Barista Board. "+e.message+"</div>"}
}
async function setStatus(id,status){
 try{
   await api(`orders?id=eq.${id}`,{method:"PATCH",body:JSON.stringify({status})});
   await loadBoard();
 }catch(e){
   alert("Could not update order status. "+e.message);
 }
}
renderMenu(); if(localStorage.mmName)customerName.value=localStorage.mmName;
</script>
</body></html>
